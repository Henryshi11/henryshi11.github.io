<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="Henry Shi 的个人主页。访问我的 GitHub 和 LinkedIn 公开资料。">
  <title>Henry Shi · 个人主页</title>
  <style>
    :root {
      --paper: #f7f5ee;
      --ink: #182f31;
      --muted: #4a5c58;
      --rule: #c9cfc4;
      --accent: #af452a;
      font: 100%/1.55 "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(58rem, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: clamp(3rem, 13vh, 8.5rem) 3.5rem;
    }
    .masthead {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding-bottom: .85rem;
      border-bottom: 1px solid var(--ink);
      font-weight: 620;
      letter-spacing: .06em;
    }
    .mark {
      width: 1.65rem;
      height: 1.65rem;
      display: grid;
      place-content: center;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font: italic bold 1.05rem/1 Georgia, serif;
      letter-spacing: -.1em;
      padding-right: .08em;
    }
    .intro {
      position: relative;
      isolation: isolate;
      display: grid;
      align-content: center;
      min-height: clamp(17rem, 32vw, 23rem);
      padding-block: 2.5rem;
    }
    .intro p { margin: 0 0 .6rem; font-size: 1.05rem; letter-spacing: .06em; }
    h1 {
      margin: 0;
      width: fit-content;
      font: 500 clamp(3.6rem, 9.3vw, 6.85rem)/1.04 "Baskervville", Georgia, "Times New Roman", serif;
      letter-spacing: -.065em;
    }
    .scene {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: 0;
      width: 35%;
      height: min(64%, 13.4rem);
      transform: translateY(-50%);
      overflow: hidden;
      border-radius: .25rem;
      background: #e9e5d6;
    }
    .sun {
      position: absolute;
      width: 23%;
      aspect-ratio: 1;
      top: 15%;
      left: 55%;
      border-radius: 50%;
      background: #d5764b;
    }
    .ridge { position: absolute; width: 150%; height: 115%; border-radius: 50%; }
    .far {
      top: 51%;
      left: 1%;
      transform: rotate(-16deg);
      background: repeating-radial-gradient(ellipse at 50% 68%, #798b7d 0 2px, #cbd0b7 2px 5px);
    }
    .near {
      top: 64%;
      right: -2%;
      transform: rotate(13deg);
      background: repeating-radial-gradient(ellipse at 46% 67%, #234345 0 3px, #98a99a 3px 5px);
    }
    nav { border-top: 1px solid var(--rule); padding-top: 1.25rem; }
    h2 { margin: 0 0 1rem; font-size: 1rem; font-weight: 620; letter-spacing: .04em; }
    .accounts {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      gap: .85rem;
    }
    .account {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 1.05rem 1.2rem;
      min-height: 5.8rem;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--rule);
      border-radius: .45rem;
      background: #fbfaf5;
      transition: border-color .16s, background .16s;
    }
    .account:hover, .account:focus-visible { background: #f0f2e9; border-color: var(--ink); }
    .account:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .symbol { width: 1.65rem; height: 1.65rem; flex: none; fill: currentColor; }
    .label { display: grid; }
    .label strong { font-size: 1.2rem; font-weight: 630; line-height: 1.3; }
    .label small { margin-top: .18rem; color: var(--muted); font-size: .94rem; }
    .arrow {
      margin-left: auto;
      width: 1.15rem;
      height: 1.15rem;
      flex: none;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      transition: transform .16s;
    }
    .account:hover .arrow, .account:focus-visible .arrow { transform: translate(2px, -2px); }
    @media (max-width: 42rem) {
      main { width: calc(100% - 2.5rem); padding-top: 2.5rem; }
      .intro { min-height: 14rem; }
      .scene { width: 28%; height: 60%; }
    }
    @media (max-width: 32rem) {
      .intro { grid-template-rows: auto 1fr; align-content: start; padding: 2.15rem 0 1.35rem; }
      .scene { position: relative; top: auto; transform: none; width: 100%; height: clamp(5rem, 25vw, 7.1rem); margin-top: 1.55rem; }
      .sun { width: 11%; top: 12%; left: 65%; }
      .far { top: 47%; }
      .near { top: 76%; }
      .account { min-height: 4.8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .account, .arrow { transition: none; }
      .account:hover .arrow, .account:focus-visible .arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="masthead"><span class="mark" aria-hidden="true">h</span>个人主页</div>
      <div class="intro">
        <p>你好，我是</p>
        <h1 lang="en">Henry Shi</h1>
        <div class="scene" aria-hidden="true"><span class="sun"></span><span class="ridge far"></span><span class="ridge near"></span></div>
      </div>
    </header>
    <nav aria-labelledby="account-heading">
      <h2 id="account-heading">公开账号</h2>
      <ul class="accounts">
        <li>
          <a class="account" href="https://github.com/Henryshi11" rel="me noreferrer">
            <svg class="symbol" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.09c-3.14.68-3.8-1.34-3.8-1.34-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 .72 1.57 1.82 3.31 1.08.1-.72.39-1.21.71-1.49-2.51-.28-5.15-1.25-5.15-5.56 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.76 10.76 0 0 1 5.64 0c2.15-1.45 3.09-1.15 3.09-1.15.61 1.55.23 2.69.11 2.98.73.79 1.16 1.79 1.16 3.02 0 4.32-2.64 5.27-5.16 5.55.41.35.77 1.03.77 2.07v2.95c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
            <span class="label"><strong lang="en">GitHub</strong><small>@Henryshi11</small></span>
            <svg class="arrow" aria-hidden="true" viewBox="0 0 20 20"><path d="M4 16 16 4M5.5 4H16v10.5"/></svg>
          </a>
        </li>
        <li>
          <a class="account" href="https://www.linkedin.com/in/henry-shi-a31371356/" rel="me noreferrer">
            <svg class="symbol" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.45 2H3.55C2.69 2 2 2.69 2 3.55v16.9c0 .86.69 1.55 1.55 1.55h16.9c.86 0 1.55-.69 1.55-1.55V3.55c0-.86-.69-1.55-1.55-1.55ZM8.15 19H5.2V9.55h2.95V19ZM6.67 8.26a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42ZM19 19h-2.94v-4.6c0-1.1-.02-2.51-1.53-2.51-1.53 0-1.77 1.2-1.77 2.43V19H9.82V9.55h2.82v1.29h.04c.39-.74 1.35-1.53 2.78-1.53 2.98 0 3.54 1.97 3.54 4.52V19Z"/></svg>
            <span class="label"><strong lang="en">LinkedIn</strong><small>职业经历</small></span>
            <svg class="arrow" aria-hidden="true" viewBox="0 0 20 20"><path d="M4 16 16 4M5.5 4H16v10.5"/></svg>
          </a>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
